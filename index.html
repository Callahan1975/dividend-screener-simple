<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dividend Screener – Baseline</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 22px; }
    h1 { margin: 0 0 14px 0; font-size: 44px; font-weight: 800; }
    .hint { color:#555; margin: 10px 0 16px; }
    #status {
      margin-top: 14px; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 10px; background: #fafafa; font-size: 13px; color:#333;
      white-space: pre-wrap;
    }
    table.dataTable thead th { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Dividend Screener – Baseline</h1>
  <div class="hint">If the table is empty: it usually means the CSV file could not be fetched from GitHub Pages.</div>

  <table id="screener" class="display" style="width:100%">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Name</th>
        <th>Country</th>
        <th>Sector</th>
        <th>Industry</th>
        <th>Price</th>
        <th>Dividend Yield (%)</th>
        <th>Payout Ratio (%)</th>
        <th>PE</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="status">Status: initializing…</div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const statusEl = document.getElementById("status");

    function log(msg) {
      statusEl.textContent += "\n" + msg;
    }

    // Try multiple locations so we survive folder changes.
    // Cache-busting added to avoid GitHub Pages caching.
    const ts = Date.now();
    const candidates = [
      `./screener_results.csv?ts=${ts}`,
      `./data/screener_results.csv?ts=${ts}`,
      `data/screener_results.csv?ts=${ts}`,
      `screener_results.csv?ts=${ts}`
    ];

    async function fetchFirstOk(urls) {
      for (const url of urls) {
        try {
          log(`Trying: ${url}`);
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            log(`  -> HTTP ${res.status}`);
            continue;
          }
          const text = await res.text();
          // basic sanity: must contain header "Ticker"
          if (!text.toLowerCase().includes("ticker")) {
            log(`  -> fetched but does not look like CSV (missing 'Ticker' header)`);
            continue;
          }
          log(`  -> OK: ${url} (${text.length} chars)`);
          return { url, text };
        } catch (e) {
          log(`  -> fetch error: ${e}`);
        }
      }
      return null;
    }

    function toNumberMaybe(v) {
      if (v === null || v === undefined) return null;
      const s = String(v).trim().replace(",", ".");
      if (s === "") return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    async function main() {
      statusEl.textContent = "Status: loading CSV…";

      const fetched = await fetchFirstOk(candidates);
      if (!fetched) {
        log("\nERROR: Could not fetch CSV from any known path.");
        log("Fix: ensure screener_results.csv is committed either in repo root OR in /data/");
        log("Also ensure GitHub Pages is serving from the same location (see instructions below).");
        return;
      }

      statusEl.textContent = `Status: parsing CSV from ${fetched.url}…`;

      const parsed = Papa.parse(fetched.text, {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: false
      });

      if (parsed.errors && parsed.errors.length) {
        log("\nCSV parse errors:");
        parsed.errors.slice(0, 5).forEach(e => log(JSON.stringify(e)));
      }

      const rows = (parsed.data || []).map(r => ({
        Ticker: r["Ticker"] ?? "",
        Name: r["Name"] ?? "",
        Country: r["Country"] ?? "",
        Sector: r["Sector"] ?? "",
        Industry: r["Industry"] ?? "",
        Price: toNumberMaybe(r["Price"]),
        "Dividend Yield (%)": toNumberMaybe(r["Dividend Yield (%)"]),
        "Payout Ratio (%)": toNumberMaybe(r["Payout Ratio (%)"]),
        PE: toNumberMaybe(r["PE"])
      }));

      statusEl.textContent = `Status: rendering ${rows.length} rows…`;

      $("#screener").DataTable({
        data: rows,
        columns: [
          { data: "Ticker" },
          { data: "Name" },
          { data: "Country" },
          { data: "Sector" },
          { data: "Industry" },
          { data: "Price", render: (d) => (d == null ? "" : d.toFixed(2)) },
          { data: "Dividend Yield (%)", render: (d) => (d == null ? "" : d.toFixed(2)) },
          { data: "Payout Ratio (%)", render: (d) => (d == null ? "" : d.toFixed(2)) },
          { data: "PE", render: (d) => (d == null ? "" : d.toFixed(2)) }
        ],
        pageLength: 25,
        order: [[0, "asc"]],
        deferRender: true
      });

      statusEl.textContent = `OK ✅ Loaded ${rows.length} rows from: ${fetched.url}`;
    }

    main();
  </script>
</body>
</html>
