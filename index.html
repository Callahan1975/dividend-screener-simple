<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dividend Screener</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .king { background-color: #e6ffe6; font-weight: bold; }
    .aristocrat { background-color: #f0f8ff; }
    .contender { background-color: #fff7e6; }
  </style>
</head>

<body>
  <h2>Dividend Screener</h2>

  <table id="screener" class="display" style="width:100%">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Name</th>
        <th>Country</th>
        <th>Sector</th>
        <th>Price</th>
        <th>DividendYield_%</th>
        <th>PayoutRatio_%</th>
        <th>ROE_%</th>
        <th>YearsGrowing</th>
        <th>DivCAGR_5Y_%</th>
        <th>DividendStreak</th>
        <th>DividendClass</th>
        <th>Score</th>
        <th>Signal</th>
      </tr>
    </thead>
  </table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    Papa.parse("docs/data/screener_results/screener_results.csv", {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {

        $('#screener').DataTable({
          data: results.data,
          columns: [
            { data: "Ticker" },
            { data: "Name" },
            { data: "Country" },
            { data: "Sector" },
            { data: "Price" },
            { data: "DividendYield_%" },
            { data: "PayoutRatio_%" },
            { data: "ROE_%" },
            { data: "YearsGrowing" },
            { data: "DivCAGR_5Y_%" },
            { data: "DividendStreak" },
            { data: "DividendClass" },
            { data: "Score" },
            { data: "Signal" }
          ],
          createdRow: function(row, data) {
            if (data.DividendClass === "King") {
              $(row).addClass("king");
            }
            if (data.DividendClass === "Aristocrat") {
              $(row).addClass("aristocrat");
            }
            if (data.DividendClass === "Contender") {
              $(row).addClass("contender");
            }
          },
          pageLength: 25,
          order: [[10, "desc"]]
        });
      }
    });
  </script>
</body>
</html>
