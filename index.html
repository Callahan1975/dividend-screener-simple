<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dividend Screener</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
  margin: 24px;
}

h1 { margin-bottom: 4px; }
.subtitle { color:#666; margin-bottom:16px; }

.controls {
  background:#f4f6f8;
  padding:12px;
  border-radius:8px;
  margin-bottom:16px;
}

.badge-buy {
  background:#2ecc71;
  color:#fff;
  padding:4px 10px;
  border-radius:6px;
  font-weight:600;
}

.badge-hold {
  background:#ccc;
  color:#333;
  padding:4px 10px;
  border-radius:6px;
  font-weight:600;
}
</style>
</head>

<body>

<h1>Dividend Screener</h1>
<div class="subtitle">Phase 4 · Buy-focused · CSV fra GitHub Actions</div>

<div class="controls">
  <label>
    <input type="checkbox" id="buyOnlyToggle">
    <strong>Vis kun BUY</strong>
  </label>
</div>

<table id="screener" class="display" style="width:100%">
  <thead>
    <tr>
      <th>Ticker</th>
      <th>Name</th>
      <th>Country</th>
      <th>Sector</th>
      <th>Price</th>
      <th>DividendYield_%</th>
      <th>PayoutRatio_%</th>
      <th>ROE_%</th>
      <th>Upside_%</th>
      <th>Quality_ROE_10p</th>
      <th>Signal</th>
    </tr>
  </thead>
</table>

<script>
let table;

$(document).ready(function () {

  table = $('#screener').DataTable({
    ajax: {
      url: 'data/screener_results.csv',
      dataType: 'text',
      dataSrc: function (csv) {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        return lines.slice(1).map(line => {
          const values = line.split(',');
          let obj = {};
          headers.forEach((h, i) => obj[h] = values[i]);
          return obj;
        });
      }
    },
    columns: [
      { data: 'Ticker' },
      { data: 'Name' },
      { data: 'Country' },
      { data: 'Sector' },
      { data: 'Price' },
      { data: 'DividendYield_%' },
      { data: 'PayoutRatio_%' },
      { data: 'ROE_%' },
      { data: 'Upside_%' },
      { data: 'Quality_ROE_10p' },
      {
        data: 'Signal',
        render: function (data) {
          if (data === 'BUY') return '<span class="badge-buy">BUY</span>';
          return '<span class="badge-hold">HOLD</span>';
        }
      }
    ],
    pageLength: 10,
    order: [[8, 'desc']]
  });

  // BUY-only filter
  $.fn.dataTable.ext.search.push(function (settings, data) {
    const buyOnly = $('#buyOnlyToggle').is(':checked');
    const signal = data[10]; // Signal column
    if (!buyOnly) return true;
    return signal.includes('BUY');
  });

  $('#buyOnlyToggle').on('change', function () {
    table.draw();
  });

});
</script>

</body>
</html>
