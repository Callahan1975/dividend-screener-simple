<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dividend Screener – Phase 2a</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 20px;
      background: #fafafa;
    }

    h1 { margin-bottom: 4px; }
    .sub { color: #555; margin-bottom: 14px; }

    table.dataTable tbody td {
      font-size: 13px;
      vertical-align: middle;
    }

    .right { text-align: right; }
    .center { text-align: center; }

    .badge {
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: inline-block;
    }

    .badge-GOLD { background: #c9a227; }
    .badge-BUY { background: #2e7d32; }
    .badge-HOLD { background: #616161; }
    .badge-WATCH { background: #c62828; }

    .confidence-High { color: #2e7d32; font-weight: 600; }
    .confidence-Medium { color: #f9a825; font-weight: 600; }
    .confidence-Low { color: #c62828; font-weight: 600; }

    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

<h1>Dividend Screener</h1>
<div class="sub">Phase 2a · Stabil core · CSV fra GitHub Actions</div>

<table id="screener" class="display stripe compact" style="width:100%">
  <thead>
    <tr>
      <th>Ticker</th>
      <th>Name</th>
      <th>Country</th>
      <th>Currency</th>
      <th>Sector</th>
      <th>Price</th>
      <th>Yield %</th>
      <th>Payout %</th>
      <th>5Y Div CAGR %</th>
      <th>Years Grow</th>
      <th>PE</th>
      <th>Fair PE</th>
      <th>Fair Value</th>
      <th>Upside %</th>
      <th>Class</th>
      <th>Signal</th>
      <th>Confidence</th>
      <th>Why</th>
      <th>Flags</th>
    </tr>
  </thead>
</table>

<div class="footer">Data: <code>/data/screener_results.csv</code></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
$(document).ready(function () {

  Papa.parse('data/screener_results.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {

      const data = results.data;
      const headers = results.meta.fields;

      function col(name) {
        return headers.includes(name) ? name : null;
      }

      $('#screener').DataTable({
        data: data,
        pageLength: 25,
        order: [[15, 'asc'], [13, 'desc']],
        columns: [
          { data: col('Ticker') },
          { data: col('Name') },
          { data: col('Country') },
          { data: col('Currency') },
          { data: col('Sector') },

          { data: col('Price'), className: 'right' },
          { data: col('DividendYield_%'), className: 'right' },
          { data: col('PayoutRatio_%'), className: 'right' },
          { data: col('DivCAGR_5Y_%'), className: 'right' },
          { data: col('YearsGrowing'), className: 'right' },

          { data: col('PE'), className: 'right' },
          { data: col('FairPE'), className: 'right' },
          { data: col('FairValue'), className: 'right' },
          { data: col('Upside_%'), className: 'right' },

          { data: col('DividendClass'), className: 'center' },

          {
            data: col('Signal'),
            className: 'center',
            render: d => d ? `<span class="badge badge-${d}">${d}</span>` : ''
          },

          {
            data: col('Confidence'),
            className: 'center',
            render: d => d ? `<span class="confidence-${d}">${d}</span>` : ''
          },

          { data: col('Why') },
          { data: col('Flags') }
        ],
        dom: 'Bfrtip',
        buttons: [{ extend: 'csvHtml5', text: 'Export CSV' }]
      });
    }
  });

});
</script>

</body>
</html>
