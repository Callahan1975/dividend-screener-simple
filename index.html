<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dividend Screener</title>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <!-- PapaParse (CSV) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }

    h1 {
      padding: 16px 20px 8px;
      margin: 0;
    }

    /* Sticky filter bar */
    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 12px 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    .filter-group label {
      margin-bottom: 4px;
      font-weight: 600;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .filter-group select {
      padding: 6px 8px;
      min-width: 160px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .filter-group.buy-active select {
      border-color: #2ecc71;
      box-shadow: 0 0 0 1px #2ecc71 inset;
    }

    .buy-info {
      font-size: 12px;
      color: #555;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .buy-info span {
      cursor: help;
      border-bottom: 1px dotted #777;
    }

    .table-wrapper {
      padding: 16px 20px 40px;
    }

    /* Buy row highlight */
    tr.buy-row td {
      background-color: #eafaf1 !important;
    }
  </style>
</head>
<body>

<h1>Dividend Screener</h1>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="filter-group" id="fg-signal">
    <label for="filter-signal">Signal</label>
    <select id="filter-signal">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group" id="fg-country">
    <label for="filter-country">Country</label>
    <select id="filter-country">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group" id="fg-sector">
    <label for="filter-sector">Sector</label>
    <select id="filter-sector">
      <option value="">All</option>
    </select>
  </div>

  <div class="buy-info">
    <span title="BUY/GOLD + no payout warning + Upside ≥ 10%">
      BUY logic ℹ️
    </span>
  </div>
</div>

<div class="table-wrapper">
  <table id="screener" class="display" style="width:100%">
    <thead>
      <tr></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const CSV_URL = "data/screener_results.csv";

let table;
let columnIndex = {};

function populateFilter(selectId, values) {
  const select = document.getElementById(selectId);
  [...new Set(values.filter(v => v && v.trim() !== ""))]
    .sort()
    .forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
}

function isBuyRow(row) {
  const signal = row.Signal || "";
  const flags = row.Flags || "";
  const upside = parseFloat((row["Upside_%"] || "0").replace("%","")) || 0;

  const signalOk = (signal === "BUY" || signal === "GOLD");
  const payoutOk = !flags.toLowerCase().includes("payout");
  const upsideOk = upside >= 10;

  return signalOk && payoutOk && upsideOk;
}

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    const data = results.data;
    const columns = Object.keys(data[0]).map(k => ({ title: k, data: k }));

    columns.forEach((c, i) => columnIndex[c.title] = i);

    table = $('#screener').DataTable({
      data: data,
      columns: columns,
      pageLength: 25,
      order: [],
      deferRender: true,
      createdRow: function(row, rowData) {
        if (isBuyRow(rowData)) {
          row.classList.add("buy-row");
        }
      }
    });

    // Populate filters
    populateFilter("filter-signal", data.map(r => r.Signal));
    populateFilter("filter-country", data.map(r => r.Country));
    populateFilter("filter-sector", data.map(r => r.Sector));

    function updateBuyFilterUI() {
      document.getElementById("fg-signal")
        .classList.toggle("buy-active",
          $("#filter-signal").val() === "BUY" || $("#filter-signal").val() === "GOLD"
        );
    }

    $('#filter-signal').on('change', function () {
      table.column(columnIndex["Signal"])
        .search(this.value ? '^' + this.value + '$' : '', true, false)
        .draw();
      updateBuyFilterUI();
    });

    $('#filter-country').on('change', function () {
      table.column(columnIndex["Country"])
        .search(this.value ? '^' + this.value + '$' : '', true, false)
        .draw();
    });

    $('#filter-sector').on('change', function () {
      table.column(columnIndex["Sector"])
        .search(this.value ? '^' + this.value + '$' : '', true, false)
        .draw();
    });
  }
});
</script>

</body>
</html>
