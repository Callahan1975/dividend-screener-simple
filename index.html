<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dividend Screener</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
h1 { margin-bottom: 20px; }
.badge-buy { color: white; background: #2ecc71; padding: 4px 8px; border-radius: 6px; }
.badge-hold { color: white; background: #f1c40f; padding: 4px 8px; border-radius: 6px; }
</style>
</head>

<body>
<h1>📈 Dividend Screener</h1>

<table id="table" class="display" style="width:100%">
<thead>
<tr>
<th>Ticker</th>
<th>Name</th>
<th>Sector</th>
<th>Price</th>
<th>Yield %</th>
<th>Payout %</th>
<th>PE</th>
<th>Signal</th>
</tr>
</thead>
</table>

<script>
$(document).ready(function () {
    $('#table').DataTable({
        ajax: 'screener_results.csv',
        columns: [
            { data: 'Ticker' },
            { data: 'Name' },
            { data: 'Sector' },
            { data: 'Price' },
            { data: 'DividendYield_%' },
            { data: 'PayoutRatio_%' },
            { data: 'PE' },
            {
              data: 'Signal',
              render: function (data) {
                if (data === "BUY") return '<span class="badge-buy">BUY</span>';
                return '<span class="badge-hold">HOLD</span>';
              }
            }
        ]
    });
});
</script>

</body>
</html>
