<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dividend Screener</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      background: #fafafa;
    }

    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; margin-bottom: 16px; }

    .panel {
      background: #f1f3f5;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters label {
      font-weight: 600;
      margin-right: 6px;
    }

    select, input[type=text] {
      padding: 6px;
    }

    .criteria label {
      margin-right: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    .criteria input:checked + span {
      background: #e6f4ea;
      border-color: #34a853;
      color: #137333;
      font-weight: 600;
    }

    .signal-buy {
      background: #2ecc71;
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      text-align: center;
    }

    .signal-hold {
      background: #ddd;
      color: #333;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>

<body>

<h1>Dividend Screener</h1>
<div class="subtitle">Phase 4 · Buy-focused · CSV fra GitHub Actions</div>
<div class="subtitle">Data: <code>/data/screener_results.csv</code></div>

<div class="panel filters">
  <label>
    <input type="checkbox" id="onlyBuy">
    Vis kun BUY
  </label>

  <div>
    <label>Country</label>
    <select id="countryFilter" multiple size="3"></select>
  </div>

  <div>
    <label>Sector</label>
    <select id="sectorFilter" multiple size="4"></select>
  </div>
</div>

<div class="panel criteria">
  <strong>Købs-kriterier (slå til/fra):</strong><br><br>

  <label>
    <input type="checkbox" id="cYield">
    <span>Yield ≥ 2.5%</span>
  </label>

  <label>
    <input type="checkbox" id="cPayout">
    <span>Payout ≤ 75%</span>
  </label>

  <label>
    <input type="checkbox" id="cROE">
    <span>ROE ≥ 10%</span>
  </label>

  <label>
    <input type="checkbox" id="cUpside">
    <span>Upside ≥ 10%</span>
  </label>

  <label>
    <input type="checkbox" id="cQuality">
    <span>Quality = True</span>
  </label>
</div>

<table id="screener" class="display" style="width:100%">
  <thead>
    <tr>
      <th>Ticker</th>
      <th>Name</th>
      <th>Country</th>
      <th>Sector</th>
      <th>Price</th>
      <th>DividendYield_%</th>
      <th>PayoutRatio_%</th>
      <th>ROE_%</th>
      <th>Upside_%</th>
      <th>Quality_ROE_10p</th>
      <th>Signal</th>
    </tr>
  </thead>
</table>

<script>
$(document).ready(function () {

  const table = $('#screener').DataTable({
    ajax: {
      url: 'data/screener_results.csv',
      dataType: 'text',
      dataSrc: function (csv) {
        const rows = csv.split('\n').slice(1);
        return rows.map(r => r.split(','));
      }
    },
    pageLength: 10,
    columns: [
      { title: "Ticker" },
      { title: "Name" },
      { title: "Country" },
      { title: "Sector" },
      { title: "Price" },
      { title: "DividendYield_%" },
      { title: "PayoutRatio_%" },
      { title: "ROE_%" },
      { title: "Upside_%" },
      { title: "Quality_ROE_10p" },
      {
        title: "Signal",
        render: function (d) {
          return d === "BUY"
            ? '<div class="signal-buy">BUY</div>'
            : '<div class="signal-hold">HOLD</div>';
        }
      }
    ]
  });

  function num(v) {
    let n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  $.fn.dataTable.ext.search.push(function (settings, data) {

    if ($('#onlyBuy').is(':checked') && data[10] !== "BUY") return false;

    let dividend = num(data[5]);
    let payout   = num(data[6]);
    let roe      = num(data[7]);
    let upside   = num(data[8]);
    let quality  = data[9] === "True";

    if ($('#cYield').is(':checked') && (dividend === null || dividend < 2.5)) return false;
    if ($('#cPayout').is(':checked') && (payout === null || payout > 0.75)) return false;
    if ($('#cROE').is(':checked') && (roe === null || roe < 10)) return false;
    if ($('#cUpside').is(':checked') && (upside === null || upside < 10)) return false;
    if ($('#cQuality').is(':checked') && !quality) return false;

    let countries = $('#countryFilter').val();
    if (countries && countries.length && !countries.includes(data[2])) return false;

    let sectors = $('#sectorFilter').val();
    if (sectors && sectors.length && !sectors.includes(data[3])) return false;

    return true;
  });

  function populateFilters() {
    let countries = new Set();
    let sectors = new Set();

    table.rows().every(function () {
      let d = this.data();
      countries.add(d[2]);
      sectors.add(d[3]);
    });

    countries.forEach(c => $('#countryFilter').append(`<option>${c}</option>`));
    sectors.forEach(s => $('#sectorFilter').append(`<option>${s}</option>`));
  }

  table.on('xhr', populateFilters);

  $('input, select').on('change', () => table.draw());
});
</script>

</body>
</html>
