<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dividend Screener</title>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }

    h1 {
      padding: 16px 20px 8px;
      margin: 0;
    }

    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 12px 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    .filter-group label {
      margin-bottom: 4px;
      font-weight: 600;
    }

    .filter-group select {
      padding: 6px 8px;
      min-width: 160px;
    }

    .preset {
      background: #eef3ff;
      border: 1px solid #c9d6ff;
    }

    .table-wrapper {
      padding: 16px 20px 40px;
    }

    tr.buy-row td {
      background-color: #eafaf1 !important;
    }

    .upside-capped {
      font-weight: 600;
    }
  </style>
</head>
<body>

<h1>Dividend Screener</h1>

<div class="filter-bar">
  <div class="filter-group">
    <label for="preset">Preset</label>
    <select id="preset" class="preset">
      <option value="">— Select preset —</option>
      <option value="buy">BUY & GOLD (Mine køb)</option>
      <option value="yield">High Yield ≥ 3%</option>
      <option value="quality">Quality Watchlist</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-signal">Signal</label>
    <select id="filter-signal">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-country">Country</label>
    <select id="filter-country">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-sector">Sector</label>
    <select id="filter-sector">
      <option value="">All</option>
    </select>
  </div>
</div>

<div class="table-wrapper">
  <table id="screener" class="display" style="width:100%">
    <thead>
      <tr></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const CSV_URL = "data/screener_results.csv";

let table;
let col = {};

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function (results) {
    const data = results.data;

    const columns = Object.keys(data[0]).map(k => {
      if (k === "Upside_%") {
        return {
          title: k,
          data: k,
          render: function (data, type) {
            if (type === "display" || type === "filter") {
              const raw = parseFloat(data) || 0;
              const capped = Math.min(raw, 100);
              return `<span class="upside-capped">${capped.toFixed(2)}</span>`;
            }
            return data;
          }
        };
      }
      return { title: k, data: k };
    });

    columns.forEach((c, i) => col[c.title] = i);

    table = $('#screener').DataTable({
      data: data,
      columns: columns,
      pageLength: 25,
      order: [],
      deferRender: true,
      createdRow: function (row, d) {
        if (
          (d.Signal === "BUY" || d.Signal === "GOLD") &&
          parseFloat(d["Upside_%"]) >= 10
        ) {
          row.classList.add("buy-row");
        }
      }
    });

    function populate(id, key) {
      [...new Set(data.map(r => r[key]).filter(v => v && v !== ""))]
        .sort()
        .forEach(v => {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          document.getElementById(id).appendChild(opt);
        });
    }

    populate("filter-signal", "Signal");
    populate("filter-country", "Country");
    populate("filter-sector", "Sector");

    $('#filter-signal').on('change', function () {
      table.column(col["Signal"])
        .search(this.value ? '^' + this.value + '$' : '', true, false)
        .draw();
    });

    $('#filter-country').on('change', function () {
      table.column(col["Country"])
        .search(this.value ? '^' + this.value + '$' : '', true, false)
        .draw();
    });

        .search(this.value ?
