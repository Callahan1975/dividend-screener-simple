<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dividend Screener</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<style>
body { font-family: -apple-system, BlinkMacSystemFont; padding:20px; }

.king { background:#e9f9e9 !important; }
.aristocrat { background:#e8f1ff !important; }
.contender { background:#fff3e0 !important; }
</style>
</head>

<body>

<h2>Dividend Screener</h2>

<div style="margin-bottom:10px">
Signal:
<select id="signalFilter"><option value="">All</option></select>
Country:
<select id="countryFilter"><option value="">All</option></select>
Sector:
<select id="sectorFilter"><option value="">All</option></select>
</div>

<table id="table" class="display" style="width:100%">
<thead>
<tr>
<th>Ticker</th>
<th>Name</th>
<th>Country</th>
<th>Sector</th>
<th>Price</th>
<th>DividendYield_%</th>
<th>PayoutRatio_%</th>
<th>ROE_%</th>
<th>YearsGrowing</th>
<th>DivCAGR_5Y_%</th>
<th>DividendStreak</th>
<th>DividendClass</th>
<th>Score</th>
<th>Signal</th>
</tr>
</thead>
</table>

<script>
$(document).ready(function () {

fetch("data/screener_results.csv")
  .then(r => r.text())
  .then(text => {
    const rows = text.trim().split("\n").slice(1).map(r => r.split(","));

    const table = $('#table').DataTable({
      data: rows,
      pageLength: 50,
      order: [[12, "desc"]],
      rowCallback: function(row, data) {
        if (data[11] === "King") $(row).addClass("king");
        if (data[11] === "Aristocrat") $(row).addClass("aristocrat");
        if (data[11] === "Contender") $(row).addClass("contender");
      }
    });

    function fillFilter(col, selector) {
      [...new Set(table.column(col).data())]
        .filter(v => v)
        .sort()
        .forEach(v => $(selector).append(`<option value="${v}">${v}</option>`));
    }

    fillFilter(13, "#signalFilter");
    fillFilter(2, "#countryFilter");
    fillFilter(3, "#sectorFilter");

    $('#signalFilter').on('change', () => table.column(13).search($('#signalFilter').val()).draw());
    $('#countryFilter').on('change', () => table.column(2).search($('#countryFilter').val()).draw());
    $('#sectorFilter').on('change', () => table.column(3).search($('#sectorFilter').val()).draw());
  });

});
</script>

</body>
</html>
