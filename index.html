<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dividend Screener</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
.king { background:#e6f7e6; }
.aristocrat { background:#e6f0ff; }
.contender { background:#fff3e6; }
</style>
</head>

<body>

<h2>Dividend Screener</h2>

Signal:
<select id="signalFilter">
  <option value="">All</option>
  <option value="BUY">BUY</option>
  <option value="HOLD">HOLD</option>
</select>

Country:
<select id="countryFilter"></select>

Sector:
<select id="sectorFilter"></select>

<table id="table" class="display" style="width:100%">
<thead>
<tr>
<th>Ticker</th>
<th>Name</th>
<th>Country</th>
<th>Sector</th>
<th>Price</th>
<th>DividendYield_%</th>
<th>PayoutRatio_%</th>
<th>ROE_%</th>
<th>YearsGrowing</th>
<th>DivCAGR_5Y_%</th>
<th>DividendStreak</th>
<th>DividendClass</th>
<th>Score</th>
<th>Signal</th>
</tr>
</thead>
</table>

<script>
$(function () {

const table = $('#table').DataTable({
  ajax: "data/screener_results.csv",
  deferRender: true,
  columns: [
    { data: "Ticker" },
    { data: "Name" },
    { data: "Country" },
    { data: "Sector" },
    { data: "Price" },
    { data: "DividendYield_%" },
    { data: "PayoutRatio_%" },
    { data: "ROE_%" },
    { data: "YearsGrowing" },
    { data: "DivCAGR_5Y_%" },
    { data: "DividendStreak" },
    { data: "DividendClass" },
    { data: "Score" },
    { data: "Signal" }
  ],
  rowCallback: function(row, data) {
    if (data.DividendClass === "King") $(row).addClass("king");
    if (data.DividendClass === "Aristocrat") $(row).addClass("aristocrat");
    if (data.DividendClass === "Contender") $(row).addClass("contender");
  }
});

// === FILTERS ===
function buildFilter(col, selector) {
  let values = new Set();
  table.column(col).data().each(v => values.add(v));
  values.forEach(v => selector.append(`<option>${v}</option>`));
}

buildFilter(2, $("#countryFilter"));
buildFilter(3, $("#sectorFilter"));

$("#countryFilter").on("change", function(){
  table.column(2).search(this.value).draw();
});
$("#sectorFilter").on("change", function(){
  table.column(3).search(this.value).draw();
});
$("#signalFilter").on("change", function(){
  table.column(13).search(this.value).draw();
});

});
</script>

</body>
</html>
