<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dividend Screener</title>

  <!-- DataTables CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css"
  />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 20px;
    }
    h1 {
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <h1>Dividend Screener</h1>

  <table id="screener" class="display" style="width:100%">
    <thead>
      <tr></tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <script>
    const CSV_URL = "data/screener_results.csv";

    console.log("Loading CSV from:", CSV_URL);

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: function (results) {
        console.log("CSV loaded:", results);

        if (!results.data || results.data.length === 0) {
          alert("CSV loaded, but contains no rows");
          return;
        }

        const columns = Object.keys(results.data[0]).map(col => ({
          title: col,
          data: col
        }));

        $("#screener").DataTable({
          data: results.data,
          columns: columns,
          pageLength: 25,
          order: [],
          deferRender: true
        });
      },
      error: function (err) {
        console.error("CSV load error:", err);
        alert("Failed to load CSV – check console");
      }
    });
  </script>
</body>
</html>
