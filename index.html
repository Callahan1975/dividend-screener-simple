<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dividend Screener</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto; margin:0; background:#f7f7f7; }
    h1 { padding:16px 20px 8px; margin:0; }

    .filter-bar {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid #ddd;
      padding: 12px 20px; display: flex; gap: 16px; flex-wrap: wrap;
    }

    .filter-group { font-size:12px; display:flex; flex-direction:column; }
    .filter-group label { font-weight:600; margin-bottom:4px; }
    .filter-group select { padding:6px 8px; min-width:160px; }

    .preset { background:#eef3ff; border:1px solid #c9d6ff; }
    .table-wrapper { padding:16px 20px 40px; }
    tr.buy-row td { background:#eafaf1 !important; }
  </style>
</head>
<body>

<h1>Dividend Screener</h1>

<div class="filter-bar">
  <div class="filter-group">
    <label>Preset</label>
    <select id="preset" class="preset">
      <option value="">— Select preset —</option>
      <option value="buy">BUY & GOLD (Mine køb)</option>
      <option value="yield">High Yield ≥ 3%</option>
      <option value="quality">Quality Watchlist</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Signal</label>
    <select id="filter-signal"><option value="">All</option></select>
  </div>

  <div class="filter-group">
    <label>Country</label>
    <select id="filter-country"><option value="">All</option></select>
  </div>

  <div class="filter-group">
    <label>Sector</label>
    <select id="filter-sector"><option value="">All</option></select>
  </div>
</div>

<div class="table-wrapper">
  <table id="screener" class="display" style="width:100%">
    <thead><tr></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const CSV_URL = "data/screener_results.csv";
let table, col = {};

Papa.parse(CSV_URL, {
  download:true, header:true, skipEmptyLines:true,
  complete: res => {
    const data = res.data;
    const cols = Object.keys(data[0]).map(k => ({ title:k, data:k }));
    cols.forEach((c,i)=>col[c.title]=i);

    table = $('#screener').DataTable({
      data, columns:cols, pageLength:25, order:[],
      createdRow:(r,d)=>{
        if ((d.Signal==="BUY"||d.Signal==="GOLD") && d.Upside_%" >= 10)
          r.classList.add("buy-row");
      }
    });

    const fill = (id, key) => [...new Set(data.map(r=>r[key]).filter(Boolean))]
      .sort().forEach(v=>$('#'+id).append(`<option>${v}</option>`));

    fill("filter-signal","Signal");
    fill("filter-country","Country");
    fill("filter-sector","Sector");

    $('#filter-signal').on('change',e=>table.column(col.Signal).search(e.target.value).draw());
    $('#filter-country').on('change',e=>table.column(col.Country).search(e.target.value).draw());
    $('#filter-sector').on('change',e=>table.column(col.Sector).search(e.target.value).draw());

    $('#preset').on('change', e => {
      const p = e.target.value;
      table.search('').columns().search('');

      if (p==="buy") {
        table.column(col.Signal).search('BUY|GOLD',true,false);
        table.column(col.Flags).search('Payout',true,false).search('',true,false);
        table.column(col.Upside_%).search('^(1[0-9]|[2-9][0-9])',true,false);
      }
      if (p==="yield") {
        table.column(col.DividendYield_%).search('^(3|4|5|6|7|8|9)',true,false);
        table.column(col.Flags).search('extreme',true,false).search('',true,false);
      }
      if (p==="quality") {
        table.column(col.ROE_%).search('^(1[0-9]|[2-9][0-9])',true,false);
      }

      table.draw();
    });
  }
});
</script>
</body>
</html>
