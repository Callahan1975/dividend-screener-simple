<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dividend Screener</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 20px;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 4px;
    }

    .sub {
      color: #555;
      margin-bottom: 8px;
    }

    table.dataTable {
      font-size: 12px;
    }

    table.dataTable th,
    table.dataTable td {
      white-space: nowrap;
    }
  </style>
</head>

<body>

<h1>Dividend Screener</h1>
<div class="sub">Phase 3 · Stabil core · CSV fra GitHub Actions</div>
<div class="sub">Data: <code>/data/screener_results.csv</code></div>

<table id="screener" class="display stripe compact" style="width:100%">
  <thead>
    <tr id="table-head"></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
$(document).ready(function () {

  Papa.parse('data/screener_results.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {

      if (!results.data || results.data.length === 0) {
        console.error("CSV loaded but contains no rows");
        return;
      }

      const headers = results.meta.fields;

      const data = results.data.map(row => {
        const clean = {};
        headers.forEach(h => {
          const v = row[h];
          clean[h] = (v === null || v === undefined)
            ? ''
            : (typeof v === 'object' ? JSON.stringify(v) : v);
        });
        return clean;
      });

      // Build table header dynamically
      const head = $('#table-head');
      headers.forEach(h => head.append(`<th>${h}</th>`));

      // Build column config
      const columns = headers.map(h => ({ data: h }));

      // Columns hidden by default (Finviz-style)
      const hiddenColumns = [
        "GeneratedUTC",
        "Country",
        "Industry",
        "DivCAGR_5Y_%",
        "YearsGrowing",
        "DividendClass",
        "FairPE",
        "ForwardPE",
        "PriceToFCF",
        "ROE_%",
        "ROA_%",
        "Value_LowPE",
        "Value_LowForwardPE",
        "Value_LowFCF",
        "Quality_ROE_10p",
        "Flags"
      ];

      const columnDefs = headers
        .map((h, idx) => hiddenColumns.includes(h)
          ? { targets: idx, visible: false }
          : null
        )
        .filter(Boolean);

      $('#screener').DataTable({
        data: data,
        columns: columns,
        columnDefs: columnDefs,
        pageLength: 25,
        scrollX: true,
        dom: 'Bfrtip',
        buttons: [
          { extend: 'csvHtml5', text: 'Export CSV' },
          { extend: 'colvis', text: 'Columns' }
        ]
      });
    }
  });

});
</script>

</body>
</html>
