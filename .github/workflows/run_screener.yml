name: Run Dividend Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # hver 6. time (kan ændres senere)

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run dividend screener
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python screener.py

      - name: Verify output files
        run: |
          echo "Checking output files..."
          ls -lah data/screener_results || exit 1
          ls -lah docs/data/screener_results || exit 1

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/screener_results/screener_results.csv
          git add docs/data/screener_results/screener_results.csv
          git commit -m "Auto update screener results" || echo "No changes to commit"
          git push
